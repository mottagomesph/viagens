:root{--bg:#EEF0EF;--card:#FFFFFF;--ink:#16191B;--soft:#4A5256;--muted:#656D71;--line:#E3E6E6;--fill:#F4F5F5;--pill:#1D2023;--pillink:#FFFFFF;--hard:#BA3E2C;--flight:#2E62A3;--hotel:#5E676B;--ok:#2E7A4F;--warn:#8F6300;--c0:#56666F;--c1:#B23A2E;--c2:#2E7A5E;--c3:#94660A;--c4:#2D5C96;--c5:#7A4E9E;--c6:#1F7E8A;--accent:#1A9E96;--accent-ink:#0F7670;--accent-deep:#01827B;--accent-puro:#1A9E96;--veil:#89431E;--veil-rgb:137 67 30;}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0D1113;--card:#171C1F;--ink:#EDF1F2;--soft:#B6C0C4;--muted:#8C979C;--line:#252C30;--fill:#1E2528;--pill:#F1F3F3;--pillink:#15181A;--hard:#EC7362;--flight:#7DA7E0;--hotel:#A9B3B7;--ok:#6CC495;--warn:#E0B04A;--c0:#8C9CA5;--c1:#DD6656;--c2:#4FAA86;--c3:#D39E38;--c4:#6F9BD8;--c5:#B08AD6;--c6:#4FB8C4;--accent:#1A9E96;--accent-ink:#26A49C;--accent-deep:#01827B;}}
:root[data-theme=dark]{--bg:#0D1113;--card:#171C1F;--ink:#EDF1F2;--soft:#B6C0C4;--muted:#8C979C;--line:#252C30;--fill:#1E2528;--pill:#F1F3F3;--pillink:#15181A;--hard:#EC7362;--flight:#7DA7E0;--hotel:#A9B3B7;--ok:#6CC495;--warn:#E0B04A;--c0:#8C9CA5;--c1:#DD6656;--c2:#4FAA86;--c3:#D39E38;--c4:#6F9BD8;--c5:#B08AD6;--c6:#4FB8C4;--accent:#1A9E96;--accent-ink:#26A49C;--accent-deep:#01827B;}
:root{
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --sombra:0 1px 2px rgba(20,28,30,.05),0 8px 24px rgba(20,28,30,.07);
  --sol-encontro:var(--accent-deep);--sol-ingresso:#BA3E2C;--sol-reserva:#BA3E2C;--sol-transporte:#2E62A3;--sol-hotel:#5E676B;
  --barra-h:calc(3.95rem + 12px);
  --gut:16px;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg);scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top) + 1.25rem)}
@supports (font:-apple-system-body){@media (hover:none) and (pointer:coarse){html{font:-apple-system-body}}}
html:has(dialog[open]),html.travado{overflow:hidden}
body{margin:0;font-family:var(--sans);font-size:1rem;line-height:1.45;overflow-wrap:break-word;color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
h1,h2,h3,h4{margin:0}
.ic{width:1.25em;height:1.25em;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.25em}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[tabindex="-1"]:focus{outline:none}
.so-leitor{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- vidro: só na moldura (6.6) ---------- */
.vidro{background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);
  border:1px solid rgba(255,255,255,.32);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(255,255,255,.10),0 8px 24px rgba(0,0,0,.16)}
.vidro.sobre-foto{background:rgba(18,22,26,.38);color:#fff;border-color:rgba(255,255,255,.22);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.30),inset 0 -1px 0 rgba(255,255,255,.06),0 8px 24px rgba(0,0,0,.18)}
.vidro.sobre-pagina{background:color-mix(in srgb,var(--card) 72%,transparent);color:var(--ink);border-color:color-mix(in srgb,var(--ink) 9%,transparent);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 8px 24px rgba(10,14,16,.12)}
.redondo{width:48px;height:48px;min-width:48px;border-radius:50%;display:grid;place-items:center;padding:0;cursor:pointer}
.redondo .ic{width:22px;height:22px}

/* ---------- abertura em tela cheia (6.3.1) ---------- */
/* A foto fica nítida em cima. Embaixo, ela mesma se desfoca de leve numa faixa curta: uma cópia
   da capa com desfoque suave, tingida pela cor do véu, entra por máscara entre --v0 e --v1.
   --v1 é onde o texto começa (o JS mede); o texto fica todo abaixo dele. */
.capa-fundo{position:fixed;inset:0;z-index:0;background:linear-gradient(170deg,var(--accent-deep),var(--veil))}
.capa{position:fixed;inset:0;z-index:0;width:100%;height:100%;object-fit:cover;display:block}
.capa-veu{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;--v1:66svh;--vb:min(15svh,7.5rem);--v0:calc(var(--v1) - var(--vb));
  --mascara:linear-gradient(transparent var(--v0),rgba(0,0,0,.1) calc(var(--v0) + var(--vb) * .25),rgba(0,0,0,.38) calc(var(--v0) + var(--vb) * .5),
    rgba(0,0,0,.76) calc(var(--v0) + var(--vb) * .75),#000 var(--v1));
  -webkit-mask-image:var(--mascara);mask-image:var(--mascara)}
.capa-veu img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;filter:blur(6px) saturate(1.1)}
.capa-veu::after{content:"";position:absolute;inset:0;background:linear-gradient(rgb(var(--veil-rgb) / .55) var(--v1),rgb(var(--veil-rgb) / .67) 100%)}
.abertura{position:relative;z-index:1;overflow-x:clip;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:space-between;
  padding:calc(env(safe-area-inset-top) + 12px) max(var(--gut),env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 1.1rem) max(var(--gut),env(safe-area-inset-left));color:#fff}
.abertura::before{content:"";position:absolute;left:0;right:0;top:0;height:calc(env(safe-area-inset-top) + 8rem);pointer-events:none;
  background:linear-gradient(rgba(8,10,12,.34),rgba(8,10,12,0))}
.topo{position:relative;display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap}
.topo-bot{display:flex;gap:.5rem}
.relogios{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;column-gap:.65rem;min-height:48px;padding:.3rem 1rem;border-radius:24px;
  font-size:.8rem;line-height:1.3;margin-left:auto}
.rel{white-space:nowrap}
.rel+.rel{padding-left:.65rem;border-left:1px solid rgba(255,255,255,.3)}
.rel-rot{font-weight:500;color:rgba(255,255,255,.86)}
.rel-h{font-weight:650;font-variant-numeric:tabular-nums;margin-left:.3em}
.pe{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center}
/* sombra suave e local atrás do título: dá legibilidade sem precisar desfocar mais a foto */
.pe::before{content:"";position:absolute;z-index:-1;left:calc(-1 * max(var(--gut),env(safe-area-inset-left)));right:calc(-1 * max(var(--gut),env(safe-area-inset-right)));
  top:-2.5rem;bottom:-1rem;pointer-events:none;
  background:radial-gradient(90% 72% at 50% 50%,rgb(var(--veil-rgb) / .5),rgb(var(--veil-rgb) / 0))}
.titulo{display:flex;flex-direction:column;align-items:center}
.boas{font-size:.72rem;font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.9);padding-left:.3em}
.cidade{font-family:Chelsea,var(--sans);font-weight:400;font-size:min(4.6rem,21vw);line-height:1;margin-top:.45rem;color:#fff;text-shadow:0 2px 24px rgba(0,0,0,.16);overflow-wrap:anywhere}
.barrinha{display:block;width:36px;height:3px;border-radius:2px;background:var(--accent-puro);margin:1rem auto .85rem}
.pais{font-size:min(.78rem,3.6vw);font-weight:500;letter-spacing:.55em;text-transform:uppercase;padding-left:.55em;color:rgba(255,255,255,.92)}
.quando{font-size:.9rem;margin-top:.45rem;color:rgba(255,255,255,.88)}
.proximo-slot{width:100%;display:flex;justify-content:center;margin-top:1.6rem;container:px/inline-size}
@container px (max-width:16rem){.proximo{grid-template-columns:1fr auto}.proximo.despedida{grid-template-columns:1fr}.px-ic{display:none}}
.proximo{width:100%;max-width:26rem;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:.8rem;min-height:3.9rem;
  padding:.5rem 1rem .5rem .5rem;border-radius:32px;text-align:left;cursor:pointer;color:#fff;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.24);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 12px 32px rgba(0,0,0,.16);
  -webkit-backdrop-filter:blur(20px) saturate(150%);backdrop-filter:blur(20px) saturate(150%)}
.proximo.despedida{cursor:default;grid-template-columns:auto 1fr}
.px-ic{width:2.75rem;height:2.75rem;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--sol-encontro);box-shadow:0 2px 8px rgba(0,0,0,.18)}
.px-ic .ic{width:1.3rem;height:1.3rem}
.px-txt{display:flex;flex-direction:column;min-width:0}
.px-rot{font-size:.68rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.8)}
.px-tit{font-size:.98rem;font-weight:600;line-height:1.3}
.px-quando{font-size:.88rem;color:rgba(255,255,255,.88);font-variant-numeric:tabular-nums}
.px-quando b{color:#fff;font-weight:650}
.proximo>.ic{color:rgba(255,255,255,.8)}

/* ---------- a folha de conteúdo (6.3.2) ---------- */
.folha-conteudo{position:relative;z-index:1;background:var(--bg);border-radius:32px 32px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.18);
  padding:.55rem max(var(--gut),env(safe-area-inset-right)) calc(var(--barra-h) + 2.5rem) max(var(--gut),env(safe-area-inset-left))}
.alca{width:36px;height:5px;border-radius:3px;background:color-mix(in srgb,var(--ink) 20%,transparent);margin:0 auto 1.4rem}
.secao{scroll-margin-top:calc(env(safe-area-inset-top) + 1.75rem)}
.secao+.secao{margin-top:2.75rem}
.secao>h2{font-size:1.5rem;font-weight:700;letter-spacing:-.02em;line-height:1.2;margin:0 .25rem 1rem}
.card{background:var(--card);border-radius:24px;box-shadow:var(--sombra)}

/* ---------- os dias: cartões empilhados (6.3.3) ---------- */
.dias{display:flex;flex-direction:column}
.dia{position:relative;border-radius:28px;overflow:hidden;background:var(--card);box-shadow:var(--sombra);isolation:isolate;
  scroll-margin-top:calc(env(safe-area-inset-top) + 1.75rem)}
.dia+.dia{margin-top:-1.35rem;box-shadow:0 -10px 24px rgba(8,12,14,.14),var(--sombra)}
/* faixa: fechada mostra data e título no alto (a parte de baixo fica sob o cartão seguinte);
   aberta vira cabeçalho com a foto viva, data numa etiqueta de vidro e título grande embaixo */
.faixa{position:relative;isolation:isolate;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"meta seta" "tit seta";
  align-content:start;align-items:center;column-gap:.75rem;row-gap:.2rem;width:100%;min-height:5.6rem;padding:1rem 1rem 2.35rem 1.2rem;
  border:0;margin:0;background:#262c30;color:#fff;text-align:left;cursor:pointer;transition:min-height .3s ease}
.dia:last-child:not(.aberto) .faixa{padding-bottom:1rem}
.dia.aberto .faixa{min-height:13rem;grid-template-rows:auto 1fr auto;grid-template-areas:"meta seta" ". ." "tit tit";padding:1rem 1rem 1.15rem 1.2rem}
.faixa:focus-visible{outline:3px solid #fff;outline-offset:-5px}
.faixa-foto{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;display:block}
.sem-foto{display:flex;align-items:center;justify-content:flex-end;overflow:hidden;background:linear-gradient(135deg,var(--cor),color-mix(in srgb,var(--cor) 50%,#000))}
.sem-foto span{font-size:3.4rem;font-weight:800;line-height:1;white-space:nowrap;color:rgba(255,255,255,.14);padding-right:.4rem;letter-spacing:-.02em}
.faixa::before,.faixa::after{content:"";position:absolute;inset:0;z-index:-1;transition:opacity .3s ease}
.faixa::before{background:linear-gradient(180deg,rgba(10,12,14,.56) 0%,rgba(10,12,14,.46) 50%,rgba(10,12,14,.28) 100%)}
.faixa::after{opacity:0;background:linear-gradient(180deg,rgba(10,12,14,.16) 0%,rgba(10,12,14,0) 26%,rgba(10,12,14,0) 42%,rgba(10,12,14,.5) 72%,rgba(10,12,14,.74) 100%)}
.dia.aberto .faixa::before{opacity:0}
.dia.aberto .faixa::after{opacity:1}
.faixa-meta{grid-area:meta;justify-self:start;display:inline-flex;align-items:center;flex-wrap:wrap;gap:.25rem .45rem;font-size:.78rem;font-weight:600;
  color:rgba(255,255,255,.95);text-shadow:0 1px 6px rgba(0,0,0,.3)}
.dia.aberto .faixa-meta{padding:.35rem .75rem .35rem .6rem;border-radius:999px;background:rgba(12,14,16,.48);border:1px solid rgba(255,255,255,.2);
  -webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%);text-shadow:none}
.bolinha{display:inline-block;width:.6rem;height:.6rem;border-radius:50%;background:var(--cor);box-shadow:0 0 0 2px rgba(255,255,255,.9);flex:none}
.faixa-tit{grid-area:tit;font-size:1.2rem;font-weight:600;line-height:1.22;letter-spacing:-.015em;text-shadow:0 1px 12px rgba(0,0,0,.28)}
.dia.aberto .faixa-tit{font-size:1.7rem;letter-spacing:-.02em}
.hoje-tag{background:#fff;color:#16191B;border-radius:999px;padding:.05rem .5rem;font-size:.7rem;font-weight:700;text-shadow:none}
.faixa-seta{grid-area:seta;width:2.25rem;height:2.25rem;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.26);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.faixa-seta .ic{width:1.1rem;height:1.1rem;transition:transform .3s ease}
.dia.aberto .faixa-seta{align-self:start}
.dia.aberto .faixa-seta .ic{transform:rotate(180deg)}
.dia-corpo{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease}
.dia.aberto .dia-corpo{grid-template-rows:1fr}
.dia-int{min-height:0;overflow:hidden}
.dia-conteudo{display:flex;flex-direction:column;gap:1.4rem;padding:1.2rem 1rem 2.6rem;container:dia/inline-size}
@container dia (max-width:15rem){.pub{grid-template-columns:minmax(0,1fr) auto}.pub .circ{display:none}}
.dia:last-child .dia-conteudo{padding-bottom:1.25rem}
.bloco-tit{font-size:.8rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 .55rem .1rem}

/* compromissos (dia aberto e Horários) */
.ag-lista{container:ag/inline-size}
.ag{position:relative}
.ag+.ag{border-top:1px solid var(--line)}
.ag-btn{display:grid;grid-template-columns:3.6rem 2.25rem minmax(0,1fr);grid-template-areas:"hora ic txt";column-gap:.6rem;align-items:start;width:100%;
  min-height:3.25rem;padding:.75rem .6rem;border:0;margin:0;background:none;text-align:left;border-radius:16px;cursor:pointer}
div.ag-btn{cursor:default}
.ag-hora{grid-area:hora;font-size:1.05rem;font-weight:700;font-variant-numeric:tabular-nums;padding-top:.3rem;line-height:1.35}
.ag-tz{display:block;font-size:.72rem;font-weight:600;color:var(--muted)}
.ag-ic{grid-area:ic;width:2.25rem;height:2.25rem;border-radius:50%;display:grid;place-items:center;color:var(--tc);background:color-mix(in srgb,var(--tc) 13%,var(--card))}
.ag-txt{grid-area:txt;display:flex;flex-direction:column;align-items:flex-start;min-width:0;padding-top:.3rem}
.ag-tit{font-weight:600;line-height:1.35}
.ag-local{display:flex;align-items:flex-start;gap:.3rem;margin-top:.15rem;color:var(--accent-ink);font-weight:600;font-size:.95rem}
.ag-det{margin-top:.15rem;color:var(--soft);font-size:.95rem}
.ag.passou{opacity:.5}
.ag.e-prox .ag-btn{box-shadow:inset 0 0 0 2px var(--accent)}
.ag.e-prox+.ag{border-top-color:transparent}
@container ag (max-width:18rem){
  .ag-btn{grid-template-columns:auto auto minmax(0,1fr);grid-template-areas:"hora ic ." "txt txt txt";row-gap:.35rem}
  .ag-txt{padding-top:0}
}
.t-encontro{--tc:var(--accent)} .t-ingresso,.t-reserva{--tc:var(--hard)} .t-transporte{--tc:var(--flight)} .t-hotel{--tc:var(--hotel)}
.t-encontro .ag-ic{color:var(--accent-ink)}
.tags{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.45rem}
.tags:empty{display:none}
.tag{display:inline-flex;align-items:center;gap:.25rem;font-size:.75rem;font-weight:600;line-height:1.25;padding:.22rem .6rem;border-radius:999px}
.tag .ic{width:1em;height:1em;vertical-align:0}
.tag-ok{background:color-mix(in srgb,var(--ok) 10%,var(--card));color:var(--ok)}
.tag-warn{box-shadow:inset 0 0 0 1.5px var(--warn);color:var(--warn)}
.tag-conf{border:1.5px dashed var(--muted);color:var(--soft);padding:.12rem .5rem}
.tag-prox{display:none;background:var(--accent-deep);color:#fff}
.ag.e-prox .tag-prox{display:inline-flex}
.tag-neutra{background:var(--fill);color:var(--soft);box-shadow:inset 0 0 0 1px var(--line)}
.tag-imp{background:var(--accent-deep);color:#fff}
.btn-desloc{display:inline-flex;align-items:center;gap:.35rem;min-height:3rem;margin-top:.35rem;padding:.55rem 1rem;border-radius:999px;border:0;cursor:pointer;
  background:color-mix(in srgb,var(--flight) 11%,var(--card));color:var(--flight);font-weight:600;text-align:left}

/* o plano */
.plano{display:flex;flex-direction:column;gap:.85rem}
.plano-l{display:grid;grid-template-columns:1.6rem minmax(0,1fr);gap:.7rem;align-items:start}
.plano-l>.ic{width:1.5rem;height:1.5rem;color:var(--accent);margin-top:.05rem}
.plano-rot{display:block;font-size:.75rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* pílulas de lugares */
.pilulas{display:flex;flex-wrap:wrap;gap:.5rem}
.pil{display:inline-flex;align-items:center;gap:.45rem;min-height:3rem;padding:.55rem 1rem;border-radius:999px;border:0;cursor:pointer;
  font-weight:600;font-size:.95rem;line-height:1.25;text-align:left;max-width:100%}
.pil .ic{width:1.05em;height:1.05em}
.pil-imp{background:var(--accent-deep);color:#fff}
.pil-tempo{background:var(--fill);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.pil-tempo .ic{color:var(--accent)}
.pil-perto{background:transparent;color:var(--soft);box-shadow:inset 0 0 0 1px var(--line);font-weight:500}

/* pub do dia, avisos e "Mais deste dia" */
.pub{display:grid;grid-template-columns:2.6rem minmax(0,1fr) auto;gap:.75rem;align-items:center;width:100%;min-height:3.5rem;padding:.75rem .85rem;
  border:0;border-radius:16px;background:var(--fill);text-align:left;cursor:pointer}
.circ{width:2.6rem;height:2.6rem;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 16%,var(--card));color:var(--accent-ink)}
.pub-rot{display:block;font-size:.75rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pub-nome{display:block;font-weight:700;color:var(--accent-ink)}
.pub-nota{display:block;color:var(--soft);font-size:.95rem}
.seta-l{color:var(--muted)}
.avisos{display:flex;flex-direction:column;gap:.5rem}
.aviso{display:grid;grid-template-columns:1.5rem minmax(0,1fr);gap:.65rem;align-items:start;padding:.75rem .9rem;border-radius:16px;background:var(--fill)}
.aviso>.ic{width:1.4rem;height:1.4rem;color:var(--soft)}
.aviso-calcado>.ic{color:var(--accent-ink)} .aviso-escadas>.ic{color:var(--warn)}
.btn-mais{display:flex;align-items:center;justify-content:center;gap:.5rem;width:100%;min-height:3rem;padding:.7rem 1rem;border-radius:999px;border:0;cursor:pointer;
  background:var(--fill);color:var(--ink);font-weight:600;box-shadow:inset 0 0 0 1px var(--line)}
.btn-mais .ic{color:var(--accent-ink)}

/* ---------- horários (6.3.4) ---------- */
.legenda{display:flex;flex-wrap:wrap;gap:.35rem 1rem;font-size:.8rem;color:var(--soft);margin:-.35rem .25rem 1rem}
.legenda li{display:flex;align-items:center;gap:.4rem}
.legenda i{width:.6rem;height:.6rem;border-radius:50%;background:var(--tc)}
.horarios{display:flex;flex-direction:column;gap:1rem}
.data-card{padding:.6rem .5rem}
.data-tit{display:flex;align-items:center;gap:.5rem;font-size:1.05rem;font-weight:700;margin:.35rem .6rem .25rem}
.data-tit.hoje{color:var(--accent-ink)}
.data-tit .tag{color:#fff;background:var(--accent-deep)}

/* ---------- nosso mapa (6.3.5) ---------- */
.mapa{position:relative;overflow:hidden;display:grid;grid-template-columns:3rem minmax(0,1fr) auto;align-items:center;gap:.9rem;min-height:5.5rem;padding:1.15rem 1.1rem;
  border-radius:24px;color:#fff;text-decoration:none;box-shadow:var(--sombra);
  background:linear-gradient(135deg,var(--accent-deep) 0%,var(--accent-deep) 60%,color-mix(in srgb,var(--accent-deep) 75%,var(--accent)) 100%)}
.mapa-ic{width:3rem;height:3rem;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.18)}
.mapa-ic .ic{width:1.5rem;height:1.5rem}
.mapa-tit{display:block;font-size:1.15rem;font-weight:700;line-height:1.3}
.mapa-sub{display:block;font-size:.9rem;color:rgba(255,255,255,.94)}
.mapa-fundo{position:absolute;right:-1.5rem;bottom:-2rem;width:9rem;height:9rem;opacity:.1;pointer-events:none}
.mapa:focus-visible{outline-color:var(--ink)}
#mapa{container:mapa/inline-size}
@container mapa (max-width:16rem){.mapa{grid-template-columns:minmax(0,1fr) auto}.mapa-ic{display:none}}

/* ---------- perto do hotel (6.3.6) ---------- */
.lista{padding:.35rem;container:lista/inline-size}
@container lista (max-width:15rem){.linha{grid-template-columns:minmax(0,1fr) auto}.linha .circ{display:none}.lista li+li::before{left:.75rem}}
.lista li{position:relative}
.lista li+li::before{content:"";position:absolute;top:0;left:3.85rem;right:.75rem;border-top:1px solid var(--line)}
.linha{display:grid;grid-template-columns:2.6rem minmax(0,1fr) auto;gap:.8rem;align-items:center;width:100%;min-height:3.5rem;padding:.6rem .65rem;
  border:0;background:none;text-align:left;border-radius:16px;cursor:pointer}
.linha-nome{display:block;font-weight:600}
.linha-sub{display:block;font-size:.9rem;color:var(--soft)}

/* ---------- úteis (6.3.7) ---------- */
.uteis{display:flex;flex-direction:column;gap:1rem}
.card-u{padding:1.1rem 1.1rem 1.2rem}
.card-u>h3{display:flex;align-items:center;gap:.5rem;font-size:.8rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:.7rem}
.card-u>h3 .ic{width:1.3rem;height:1.3rem;color:var(--accent-ink)}
.hotel-nome{font-size:1.25rem;font-weight:700;line-height:1.3}
.suave{color:var(--soft)}
.info{display:flex;flex-direction:column;gap:.55rem;margin-top:.75rem}
.info li{display:grid;grid-template-columns:1.35rem minmax(0,1fr);gap:.65rem;align-items:start}
.info li>.ic{width:1.25rem;height:1.25rem;color:var(--soft);margin-top:.1rem}
.info a{color:var(--accent-ink);font-weight:600;text-decoration:none;display:inline-flex;align-items:center;min-height:3rem;margin:-.75rem 0}
.botoes{display:flex;flex-direction:column;gap:.6rem;margin-top:1.1rem}
.btn{display:flex;align-items:center;justify-content:center;gap:.5rem;min-height:3rem;padding:.7rem 1.1rem;border-radius:999px;border:0;cursor:pointer;
  font-weight:600;text-decoration:none;text-align:center;line-height:1.3}
.btn-pri{background:var(--pill);color:var(--pillink)}
.btn-sec{background:var(--fill);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.marcadores{display:flex;flex-direction:column;gap:.55rem}
.marcadores li{display:grid;grid-template-columns:.5rem minmax(0,1fr);gap:.7rem;align-items:start}
.marcadores li::before{content:"";width:.4rem;height:.4rem;border-radius:50%;background:var(--accent);margin-top:.55em}
.emerg{container:emerg/inline-size}
.emerg li+li{border-top:1px solid var(--line)}
.emerg a{display:grid;grid-template-columns:minmax(4.6rem,auto) minmax(0,1fr) auto;align-items:center;gap:.9rem;min-height:3.5rem;padding:.5rem .15rem;color:inherit;text-decoration:none}
.emerg .num{font-size:2.2rem;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:var(--hard);line-height:1.1}
.emerg a>.ic{color:var(--muted)}
@container emerg (max-width:17rem){.emerg a{grid-template-columns:minmax(0,1fr) auto;row-gap:.1rem}.emerg a>span:nth-child(2){grid-column:1 / -1;grid-row:2}}
.fonte{margin-top:.5rem;font-size:.85rem;color:var(--muted)}

.rodape{margin-top:2.75rem;text-align:center;font-size:.85rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:.6rem}
.selo{display:inline-block;padding:.2rem .8rem;border-radius:999px;box-shadow:inset 0 0 0 1.5px var(--warn);color:var(--warn);font-weight:700;letter-spacing:.14em;font-size:.75rem}

/* ---------- barra inferior e bordas de desfoque (6.3.8) ---------- */
.barra{position:fixed;z-index:20;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));
  max-width:30rem;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.2rem;padding:.35rem;border-radius:999px}
.barra.duas{grid-template-columns:repeat(2,minmax(0,1fr));border-radius:30px}
.barra,.borda-base{transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .25s ease,visibility 0s linear .35s}
body:not(.mostra-barra) .barra{transform:translateY(calc(100% + 24px));opacity:0;visibility:hidden}
body:not(.mostra-barra) .borda-base{opacity:0;visibility:hidden}
body.mostra-barra .barra,body.mostra-barra .borda-base{transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .25s ease,visibility 0s}
.barra a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem;min-height:3.25rem;min-width:0;padding:.3rem .2rem;
  border-radius:999px;color:inherit;text-decoration:none;font-size:.72rem;font-weight:600;line-height:1.2;transition:background-color .2s,color .2s}
.barra a span{display:block;white-space:nowrap;max-width:100%}
.barra a .ic{width:1.45rem;height:1.45rem}
.barra.sobre-foto a[aria-current]{background:rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.barra.sobre-pagina a[aria-current]{background:color-mix(in srgb,var(--accent) 14%,var(--card));color:var(--accent-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 1px 4px rgba(10,14,16,.08)}
.borda-base,.borda-topo{position:fixed;left:0;right:0;z-index:15;pointer-events:none}
.borda-base{bottom:0;height:calc(var(--barra-h) + 1.75rem)}
.borda-topo{top:0;height:calc(env(safe-area-inset-top) + 1.6rem);opacity:0;transition:opacity .2s}
body.na-folha .borda-topo{opacity:1}
.borda-base i,.borda-topo i{position:absolute;inset:0}
.borda-base i:nth-child(1){-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);-webkit-mask-image:linear-gradient(to top,#000 45%,transparent);mask-image:linear-gradient(to top,#000 45%,transparent)}
.borda-base i:nth-child(2){-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);-webkit-mask-image:linear-gradient(to top,#000 25%,transparent 70%);mask-image:linear-gradient(to top,#000 25%,transparent 70%)}
.borda-base i:nth-child(3){-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);-webkit-mask-image:linear-gradient(to top,#000 10%,transparent 45%);mask-image:linear-gradient(to top,#000 10%,transparent 45%)}
.borda-base::after{content:"";position:absolute;inset:0;opacity:0;transition:opacity .2s;background:linear-gradient(to top,color-mix(in srgb,var(--bg) 78%,transparent),transparent)}
body.barra-na-folha .borda-base::after{opacity:1}
.borda-topo i:nth-child(1){-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);-webkit-mask-image:linear-gradient(#000 40%,transparent);mask-image:linear-gradient(#000 40%,transparent)}
.borda-topo i:nth-child(2){-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);-webkit-mask-image:linear-gradient(#000 20%,transparent 65%);mask-image:linear-gradient(#000 20%,transparent 65%)}
.borda-topo i:nth-child(3){-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);-webkit-mask-image:linear-gradient(#000 5%,transparent 40%);mask-image:linear-gradient(#000 5%,transparent 40%)}
.borda-topo::after{content:"";position:absolute;inset:0;background:linear-gradient(color-mix(in srgb,var(--bg) 80%,transparent),transparent)}

/* ---------- folhas que sobem de baixo (6.4) ---------- */
dialog.folha{position:fixed;inset:auto 0 0 0;width:100%;max-width:40rem;max-height:90vh;max-height:90svh;margin:0 auto;padding:0;border:0;
  border-radius:32px 32px 0 0;background:var(--card);color:var(--ink);overflow:hidden;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 -12px 40px rgba(0,0,0,.25)}
dialog.folha[open]{display:flex;flex-direction:column;animation:sobe .28s cubic-bezier(.2,.8,.2,1)}
dialog.folha::backdrop{background:rgba(0,0,0,.28);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
dialog.folha[open]::backdrop{animation:surge .28s ease}
@keyframes sobe{from{transform:translateY(100%)}}
@keyframes surge{from{opacity:0}}
.folha-alca{flex:none;width:36px;height:5px;border-radius:3px;margin:8px auto 0;background:color-mix(in srgb,var(--ink) 20%,transparent)}
.folha-cab{flex:none;display:flex;align-items:flex-start;justify-content:space-between;gap:.75rem;padding:.35rem .9rem .35rem 1.25rem}
.folha-cab h2{font-size:1.35rem;font-weight:700;letter-spacing:-.01em;line-height:1.25;padding-top:.65rem;min-width:0}
.fechar.vidro.sobre-pagina{background:color-mix(in srgb,var(--fill) 85%,transparent);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 2px 8px rgba(10,14,16,.08)}
.folha-corpo{overflow-y:auto;overscroll-behavior:contain;padding:.35rem 1.25rem calc(1.75rem + env(safe-area-inset-bottom))}
.folha-corpo>*+*{margin-top:1.1rem}
.sub-tit{display:flex;align-items:center;gap:.45rem;font-size:.8rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
.sub-tit .ic{width:1.15rem;height:1.15rem;color:var(--accent-ink)}
.nota-caixa{display:grid;grid-template-columns:1.4rem minmax(0,1fr);gap:.6rem;padding:.8rem .9rem;border-radius:16px;background:var(--fill)}
.nota-caixa>.ic{color:var(--accent-ink);width:1.3rem;height:1.3rem}
.comp-tipo{display:inline-flex;align-items:center;gap:.4rem;font-weight:700;color:var(--tc)}
.t-encontro.comp-tipo{color:var(--accent-ink)}
.comp-quando{font-size:1.6rem;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1.25}
.comp-quando small{display:block;font-size:.9rem;font-weight:600;color:var(--soft);letter-spacing:0}
.comp-falta{font-weight:600;color:var(--accent-ink)}
.comp-local b{display:block}
.lt{position:relative;container:lt/inline-size}
.lt li{display:grid;grid-template-columns:3.6rem 1rem minmax(0,1fr);column-gap:.6rem;align-items:start;position:relative}
.lt li::before{content:"";position:absolute;left:calc(3.6rem + .6rem + .5rem - 1px);top:0;bottom:0;border-left:2px solid var(--line)}
.lt li:first-child::before{top:.85rem}
.lt li:last-child::before{bottom:auto;height:.85rem}
.lt-hora{font-size:1.15rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.4}
.lt-pt{position:relative;z-index:1;width:1rem;height:1rem;margin-top:.3rem;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 3px var(--flight)}
.lt-info{padding-bottom:1rem;min-width:0}
.lt-info b{display:block;line-height:1.4}
.lt-data,.lt-det{display:block;font-size:.9rem;color:var(--soft)}
.lt-trecho .lt-info{display:flex;gap:.5rem;align-items:flex-start;color:var(--soft);font-size:.95rem;padding:.1rem 0 1rem}
.lt-trecho .lt-info .ic{color:var(--flight);margin-top:.1rem}
.lt-trecho::before{border-left-style:dashed!important}
@container lt (max-width:18rem){
  .lt li{grid-template-columns:1rem minmax(0,1fr)}
  .lt li::before{left:calc(.5rem - 1px)}
  .lt-hora{grid-column:2;grid-row:1}
  .lt-pt{grid-column:1;grid-row:1}
  .lt-info{grid-column:2}
  .lt-trecho>span:empty{display:none}
}
.org{display:flex;flex-direction:column}
.org li{padding:.65rem 0}
.org li+li{border-top:1px solid var(--line)}
.org-rot{display:block;font-size:.8rem;font-weight:600;color:var(--muted)}
.regras{counter-reset:r;display:flex;flex-direction:column;gap:.9rem}
.regras li{display:grid;grid-template-columns:2rem minmax(0,1fr);gap:.75rem;align-items:start;counter-increment:r}
.regras li::before{content:counter(r);width:2rem;height:2rem;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;background:var(--accent-deep)}
.regras b{display:block}

/* ---------- mostrar ao motorista ---------- */
.motorista{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;justify-content:center;gap:1.5rem;overflow:auto;cursor:pointer;text-align:center;
  padding:calc(env(safe-area-inset-top) + 2rem) 1.5rem calc(env(safe-area-inset-bottom) + 2rem);background:#fff;color:#000}
.m-nome{font-size:2.6rem;font-weight:800;line-height:1.15;overflow-wrap:anywhere}
.m-end{font-size:1.7rem;line-height:1.3;overflow-wrap:anywhere}
.m-dica{font-size:.95rem;color:#555}

/* ---------- preferências do sistema ---------- */
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
}
@media (prefers-reduced-transparency:reduce){
  .vidro{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--card)}
  .proximo{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(0,0,0,.28)}
  .vidro.sobre-foto{background:#15191C}

<script>
(() => {
'use strict';
const D = JSON.parse(document.getElementById('dados').textContent);
const C = D.cidade, H = D.hotel, U = D.uteis || {};
const POI = D.pois || {};
const DESL = Object.fromEntries((D.deslocamentos || []).map(x => [x.id, x]));
const AG = (D.agenda || []).map(a => ({...a, ms: Date.parse(a.t)})).sort((a, b) => a.ms - b.ms);
AG.forEach((a, i) => { a.i = i; });

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const ic = (n, cls = '') => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const reduzMov = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const tentar = (nome, fn) => { try { fn(); } catch (e) { console.error('Erro ao desenhar ' + nome + ':', e); } };

// ---------- datas e horas ----------
const SEM = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
const hhmm = iso => iso.slice(11, 16);
const ymd = iso => iso.slice(0, 10);
const rotData = d => {
  const [y, m, dd] = d.split('-').map(Number);
  return `${SEM[new Date(Date.UTC(y, m - 1, dd, 12)).getUTCDay()]} ${String(dd).padStart(2, '0')}/${String(m).padStart(2, '0')}`;
};
const fmtDia = new Intl.DateTimeFormat('en-CA', {timeZone: C.fuso, year: 'numeric', month: '2-digit', day: '2-digit'});
const hoje = () => {
  const p = Object.fromEntries(fmtDia.formatToParts(new Date()).map(x => [x.type, x.value]));
  return `${p.year}-${p.month}-${p.day}`;
};
const relCidade = new Intl.DateTimeFormat('pt-BR', {timeZone: C.fuso, hour: '2-digit', minute: '2-digit', hourCycle: 'h23'});
const relBrasil = new Intl.DateTimeFormat('pt-BR', {timeZone: 'America/Sao_Paulo', hour: '2-digit', minute: '2-digit', hourCycle: 'h23'});
function falta(ms) {
  const min = Math.ceil(ms / 60000);
  if (min <= 0) return 'agora';
  const d = Math.floor(min / 1440), h = Math.floor((min % 1440) / 60), m = min % 60;
  if (d >= 7) return `em ${d} dias`;
  if (d >= 1) return `em ${d} ${d === 1 ? 'dia' : 'dias'}` + (h ? ` e ${h} h` : '');
  if (h >= 1) return `em ${h} h` + (m ? ` ${String(m).padStart(2, '0')} min` : '');
  return `em ${m} min`;
}
const distTxt = km => km < 1 ? `${Math.max(10, Math.round(km * 100) * 10)} m` : `${km.toFixed(1).replace('.', ',')} km`;

// ---------- lugares e mapas ----------
const ehHotel = s => s === H.nome || s === H.nome_local;
const nomeDoLocal = s => POI[s] ? POI[s].nome : ehHotel(s) ? H.nome : s;
function urlMaps(s) {
  const p = POI[s];
  let q = s;
  if (p) q = p.endereco_local ? `${p.nome_local || p.nome}, ${p.endereco_local}` : `${p.lat},${p.lon}`;
  else if (ehHotel(s)) q = `${H.nome_local || H.nome}, ${H.endereco}`;
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
}
const botaoMaps = s => `<a class="btn btn-pri" href="${esc(urlMaps(s))}" target="_blank" rel="noopener">${ic('mapa')}Abrir no Google Maps</a>`;

// ---------- compromissos ----------
const TIPO = {encontro: ['Encontro', 'encontro'], ingresso: ['Ingresso', 'ingresso'], reserva: ['Reserva', 'reserva'], hotel: ['Hotel', 'hotel'], transporte: ['Trem', 'trem']};
const modoDe = a => (DESL[a.fl] || {}).modo === 'voo' ? 'voo' : 'trem';
const icTipo = a => a.tipo === 'transporte' ? modoDe(a) : TIPO[a.tipo][1];
const rotTipo = a => a.tipo === 'transporte' ? (modoDe(a) === 'voo' ? 'Voo' : 'Trem') : TIPO[a.tipo][0];
function tagsSituacao(a) {
  const t = [];
  if (a.tipo === 'ingresso' && a.status === 'comprado') t.push(`<span class="tag tag-ok">${ic('check')}Ingresso comprado</span>`);
  if (a.tipo === 'ingresso' && a.status === 'a comprar') t.push('<span class="tag tag-warn">Ingresso a comprar</span>');
  if (a.tipo === 'transporte' && a.status === 'a comprar') t.push('<span class="tag tag-warn">Bilhete a comprar</span>');
  if (a.status === 'a confirmar') t.push('<span class="tag tag-conf">a confirmar</span>');
  return t.join('');
}
function itemAg(a, completo) {
  const cab = `<span class="ag-hora">${hhmm(a.t)}${a.tz ? `<span class="ag-tz">${esc(a.tz)}</span>` : ''}</span>`
    + `<span class="ag-ic">${ic(icTipo(a))}</span>`;
  const tags = `<span class="tags">${tagsSituacao(a)}<span class="tag tag-prox">próximo</span></span>`;
  const li = `<li class="ag t-${a.tipo}" data-ai="${a.i}">`;
  if (a.tipo === 'transporte') {
    const rotulo = modoDe(a) === 'voo' ? 'Detalhes do voo' : 'Detalhes do trem';
    if (completo) return `${li}<div class="ag-btn">${cab}<span class="ag-txt"><span class="ag-tit">${esc(a.l)}</span>${tags}`
      + `<button type="button" class="btn-desloc" data-fl="${esc(a.fl)}">${rotulo}${ic('seta')}</button></span></div></li>`;
    return `${li}<button type="button" class="ag-btn" data-fl="${esc(a.fl)}">${cab}<span class="ag-txt"><span class="ag-tit">${esc(a.l)}</span>${tags}</span></button></li>`;

function desenharDias() {

    const foto = d.foto ? `<img class="faixa-foto" src="${esc(d.foto)}" alt="" decoding="async">` : semFoto(d);

      + `<h3 class="dia-cab"><button type="button" class="faixa" data-dia="${d.n}" aria-expanded="false" aria-controls="dia${d.n}-corpo">${foto}`

    if (img.complete && !img.naturalWidth) falhou(); else img.addEventListener('error', falhou, {once: true});
  });
  // qual abre sozinho: hoje durante a estadia; antes da viagem, o primeiro; depois, nenhum

  if (m && $('#dia' + m[1])) abrir = +m[1];

const semFoto = d => `<span class="faixa-foto sem-foto" aria-hidden="true"><span>${esc(d.titulo)}</span></span>`;
function abrirDia(n) {
  $$('.dia').forEach(el => {

function rolarAte(el) { if (el) el.scrollIntoView({behavior: reduzMov() ? 'auto' : 'smooth', block: 'start'}); }
function alternarDia(n) {

  if (el.classList.contains('aberto')) { abrirDia(null); return; }
  abrirDia(n);

    const r = el.getBoundingClientRect();

const REGRAS = [
  ['Um bairro por dia.', 'Cada dia gira em torno de uma região da cidade. Metrô ou carro só para ir e voltar; lá dentro, a pé.'],
  ['Imperdíveis primeiro.', 'Depois, o que der tempo; e, se passar na porta, o resto.'],
  ['Hora marcada só para o que tem hora.', 'Encontros, ingressos, trens e reservas. O resto se ajusta no dia.'],
  ['Uma pausa longa por dia.', 'Café, almoço sem pressa ou descanso no hotel.'],
  ['Plano B.', 'Cada dia diz o que cortar primeiro e com qual dia trocar se chover.'],
  ['Perto do hotel.', 'Lugares para comer e beber em qualquer noite.'],
];
const folhaInfo = de => abrirFolha('info', 'Como funciona o roteiro de órbitas',
  `<ol class="regras">${REGRAS.map(([t, x]) => `<li><span><b>${t}</b>${x}</span></li>`).join('')}</ol>`, de);

// ---------- mostrar ao motorista ----------
const mot = $('#motorista');
let motOrigem = null;
function mostrarMotorista(nome, endereco, de) {
  motOrigem = folha.open ? origem : de;
  if (folha.open) { indoAoMotorista = true; folha.close(); }
  $('#m-nome').textContent = nome;
  $('#m-end').textContent = endereco || '';
  mot.hidden = false;
  document.documentElement.classList.add('travado');
  mot.focus();
}
function fecharMotorista() {
  mot.hidden = true;
  document.documentElement.classList.remove('travado');
  if (motOrigem && motOrigem.isConnected) motOrigem.focus({preventScroll: true});
  motOrigem = null;
}
mot.addEventListener('click', fecharMotorista);
mot.addEventListener('keydown', e => { if (e.key === 'Escape' || e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fecharMotorista(); } });

// ---------- toques ----------
document.addEventListener('click', e => {
  const el = e.target.closest('[data-poi],[data-ag],[data-fl],[data-mais],[data-dia],[data-motorista],[data-motorista-poi]');
  if (!el) return;
  const ds = el.dataset;
  if (ds.dia !== undefined) alternarDia(ds.dia);
  else if (ds.poi !== undefined) folhaLugar(ds.poi, el);
  else if (ds.ag !== undefined) folhaCompromisso(+ds.ag, el);
  else if (ds.fl !== undefined) folhaDeslocamento(ds.fl, el);
  else if (ds.mais !== undefined) folhaMais(ds.mais, el);
  else if (ds.motoristaPoi !== undefined) { const p = POI[ds.motoristaPoi]; if (p) mostrarMotorista(p.nome_local || p.nome, p.endereco_local, el); }
  else if (ds.motorista !== undefined) {
    const m = ds.motorista === 'hotel' ? motoristaHotel() : (U.motorista || [])[+ds.motorista];
    if (m) mostrarMotorista(m.nome_local, m.endereco, el);
  }
});
$('#btn-info').addEventListener('click', e => folhaInfo(e.currentTarget));
window.addEventListener('hashchange', () => {
  const m = /^#dia(\d+)$/.exec(location.hash);
  if (m && $('#dia' + m[1])) { abrirDia(+m[1]); rolarAte($('#dia' + m[1])); }
});

// ---------- tema ----------
const raiz = document.documentElement;
const escuroSistema = matchMedia('(prefers-color-scheme: dark)');
const ehEscuro = () => raiz.dataset.theme ? raiz.dataset.theme === 'dark' : escuroSistema.matches;
const btnTema = $('#btn-tema');
function sincronizarTema() {
  btnTema.querySelector('use').setAttribute('href', ehEscuro() ? '#i-sol' : '#i-lua');
  btnTema.setAttribute('aria-label', ehEscuro() ? 'Mudar para o tema claro' : 'Mudar para o tema escuro');
}
btnTema.addEventListener('click', () => {
  const t = ehEscuro() ? 'light' : 'dark';
  raiz.dataset.theme = t;
  try { localStorage.setItem('tema', t); } catch (e) {}
  sincronizarTema();
});
escuroSistema.addEventListener('change', sincronizarTema);

// ---------- barra inferior, bordas e rolagem ----------
const barra = $('#barra'), abertura = $('#inicio'), conteudo = $('#conteudo');
function medirBarra() {
  barra.classList.remove('duas');
  if ($$('a span', barra).some(s => s.scrollWidth > s.clientWidth + 1)) barra.classList.add('duas');
  const r = barra.getBoundingClientRect();
  raiz.style.setProperty('--barra-h', Math.ceil(innerHeight - r.top) + 'px');
}
const pe = $('.pe'), topo = $('.topo'), veu = $('.capa-veu');
function posicionarVeu() {   // o véu completo começa logo acima do título
  if (veu) veu.style.setProperty('--v1', Math.round(pe.offsetTop - 10) + 'px');
}
function aoRolar() {
  const folhaTopo = conteudo.getBoundingClientRect().top;
  document.body.classList.toggle('mostra-barra', folhaTopo < innerHeight * .8);
  const sumir = Math.max(0, Math.min(1, scrollY / (innerHeight * .3)));
  pe.style.opacity = topo.style.opacity = String(1 - sumir);
  const ab = abertura.getBoundingClientRect(), br = barra.getBoundingClientRect();
  const sobreFoto = ab.bottom > br.top + br.height / 2;
  barra.classList.toggle('sobre-foto', sobreFoto);
  barra.classList.toggle('sobre-pagina', !sobreFoto);
  document.body.classList.toggle('barra-na-folha', !sobreFoto);
  document.body.classList.toggle('na-folha', conteudo.getBoundingClientRect().top < 4);
}
let rafRolar = 0;
addEventListener('scroll', () => { if (!rafRolar) rafRolar = requestAnimationFrame(() => { rafRolar = 0; aoRolar(); }); }, {passive: true});
addEventListener('resize', () => { medirBarra(); posicionarVeu(); aoRolar(); });
if ('ResizeObserver' in window) new ResizeObserver(() => medirBarra()).observe(barra);
function ativarNav(id) { $$('a', barra).forEach(a => { if (a.dataset.nav === id) a.setAttribute('aria-current', 'true'); else a.removeAttribute('aria-current'); }); }
function observarSecoes() {
  ativarNav('inicio');
  if (!('IntersectionObserver' in window)) return;
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting && ['inicio', 'dias', 'horarios', 'uteis'].includes(e.target.id)) ativarNav(e.target.id);
  }), {rootMargin: '-40% 0px -55% 0px'});
  ['inicio', 'dias', 'horarios', 'uteis'].forEach(id => { const s = $('#' + id); if (s) io.observe(s); });
}

// ---------- capa e início ----------
const capa = $('#capa');
if (capa) capa.addEventListener('error', () => { capa.hidden = true; });
addEventListener('online', rede);
addEventListener('offline', rede);
tentar('tema', sincronizarTema);
tentar('relógios', relogios);
tentar('dias', desenharDias);
tentar('horários', desenharHorarios);
tentar('mapa', desenharMapa);
tentar('perto do hotel', desenharPerto);
tentar('úteis', desenharUteis);
tentar('rodapé', desenharRodape);
tentar('próximo compromisso', proximo);
tentar('estados', estados);
tentar('barra', () => { medirBarra(); posicionarVeu(); aoRolar(); observarSecoes(); });
if (document.fonts) document.fonts.ready.then(() => tentar('véu', posicionarVeu));
setInterval(() => { tentar('relógios', relogios); tentar('próximo compromisso', proximo); tentar('estados', estados); }, 30000);
if ('serviceWorker' in navigator && (location.protocol === 'https:' || ['localhost', '127.0.0.1'].includes(location.hostname))) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
})();
</script>
</body>
